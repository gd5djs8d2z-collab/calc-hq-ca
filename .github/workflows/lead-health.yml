# Is the live lead form able to deliver a lead? Runs scripts/check-lead-health.sh against
# https://calc-hq.ca — see that file for the three checks. Nothing here creates, reads or
# deletes a lead.
#
# WHY IT EXISTS
#   A broken form fails silently: the visitor sees "didn't go through", nothing reaches the
#   Sheet, and nobody is told. On launch day (2026-10-16) a deploy left the Worker without its
#   secrets and the only way to notice was to look. A failing run emails the repo owner
#   (GitHub's default for failed workflow runs), so a break is reported within the hour.
#
# WHEN IT RUNS
#   - hourly, at :23;
#   - after every push to main, once Cloudflare's Workers Builds check for that exact commit
#     has finished, so it tests the version that push deployed (a failed build fails this);
#   - on demand (Actions → lead-health → Run workflow).
#
# NEEDS
#   Repository secret LEAD_HEALTH_TOKEN, equal to the Worker secret of the same name. It only
#   opens /api/lead/health. Scheduled workflows are paused by GitHub after 60 days without a
#   commit to the repo; re-enable it from the Actions tab if that happens.

name: lead-health

on:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: lead-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Wait for Cloudflare to deploy this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 80); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))][0] // empty | "\(.status) \(.conclusion)"')
            echo "$(date -u +%T) Workers Builds: ${state:-not started}"
            case "$state" in
              "completed success") sleep 30; exit 0 ;;
              completed*) echo "::error::Cloudflare's build for this commit did not succeed ($state) — the site was not redeployed."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::No finished Cloudflare build for ${{ github.sha }} after 20 minutes."
          exit 1

      - name: Check the live lead form
        env:
          LEAD_HEALTH_TOKEN: ${{ secrets.LEAD_HEALTH_TOKEN }}
          # After a deploy, allow for the new version to reach every edge.
          ATTEMPTS: ${{ github.event_name == 'push' && '6' || '2' }}
          WAIT: '20'
        run: |
          if [ -z "$LEAD_HEALTH_TOKEN" ]; then
            echo "::error::Repository secret LEAD_HEALTH_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          set +e
          out=$(bash scripts/check-lead-health.sh 2>&1); rc=$?
          printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          # Each cause becomes an error annotation, so it shows on the run page and in the email.
          [ "$rc" -eq 0 ] || printf '%s\n' "$out" | sed -n 's/^  - //p' | sort -u |
            while IFS= read -r line; do echo "::error title=Lead form not working::$line"; done
          exit "$rc"
