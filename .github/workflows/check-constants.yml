# Tax-constant stamp + staleness gate, plus the value-change audit-trail gate.
#
# Runs scripts/check-constants.mjs, which fails when any constant in
# data/tax-constants-2026.js is UNSTAMPED, NO-SOURCE, UNVERIFIED, STALE, or violates a
# cross-field invariant. See MAINTENANCE.md Rule 4.
#
# Then runs scripts/check-history.mjs, which fails when data/constant-history.json (the
# append-only value-change history) has drifted from the live stamps — a missing/duplicate
# in-force row, a value that no longer deep-equals the live constant, or a stale source_url.
# Regenerate the file with `node scripts/gen-history.mjs` when it flags drift.
#
# Then runs scripts/test-invariants.mjs, the NEGATIVE tests for the cross-field invariants.
# This covers something the first step structurally cannot: check-constants passing proves the
# current data is consistent, not that invariants() would actually CATCH inconsistent data. The
# tests corrupt a clone of the constants and assert each invariant fires — and that it stays
# quiet where firing would be a false alarm (e.g. comparing two different benefit years).
# Without this step an invariant could silently rot into a no-op and every run would stay green.
#
# Finally runs scripts/check-redirects.mjs, the gate on _redirects. Cloudflare follows a
# redirect "regardless of whether or not an asset matches the incoming request", so a rule
# whose SOURCE is a live page shadows that page while still returning HTTP 200 — invisible
# to a link checker. It also fails when a page in sitemap.xml has no extensionless 301,
# which would leave it answering 307 (temporary, consolidates nothing) from
# assets.html_handling instead. See the header of _redirects.
#
# WHY THE SCHEDULE MATTERS MORE THAN THE PUSH TRIGGER
#   STALE is time-based, not diff-based: a value goes stale because a January / July /
#   quarterly boundary passed, not because anyone edited a file. A push-only gate would
#   therefore never fire for the failure it most needs to catch. The monthly cron is the
#   part of this workflow that actually enforces the maintenance rules; it lands on the
#   1st, so the Jan/Apr/Jul/Oct rollovers are caught within days.
#
# A failing scheduled run emails the repo owner (GitHub's default for scheduled workflows).
#
# NOTE ON package.json: the repo deliberately has none. data/*.js use ESM syntax, so Node
# needs {"type":"module"} to parse them — but committing a package.json to the repo root
# risks Cloudflare auto-detecting a Node build for what is a pure static-asset deploy
# (see wrangler.jsonc). So the CI job writes a throwaway one into its own checkout instead.

name: check-constants

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 12 1 * *'   # 12:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Mark the checkout as ESM (not committed — see note above)
        run: echo '{"type":"module","private":true}' > package.json

      - name: Run the constants check
        id: check
        run: |
          set -o pipefail
          node scripts/check-constants.mjs | tee report.txt

      - name: Run the history check
        id: checkhistory
        if: always()   # always evaluate the audit trail, even if the constants step already failed
        run: |
          set -o pipefail
          node scripts/check-history.mjs | tee history-report.txt

      - name: Run the invariant negative tests
        id: checkinvariants
        if: always()   # a green constants run proves nothing about whether the gate CAN fail
        run: |
          set -o pipefail
          node scripts/test-invariants.mjs | tee invariant-report.txt

      - name: Run the redirect check
        id: checkredirects
        if: always()   # _redirects is the one file where a typo removes a live page
        run: |
          set -o pipefail
          node scripts/check-redirects.mjs | tee redirect-report.txt

      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo '## Tax-constant stamp + staleness check'
            echo
            echo '```'
            cat report.txt 2>/dev/null || echo 'checker did not produce output — it likely failed to load'
            echo '```'
            if [ '${{ steps.check.outcome }}' != 'success' ]; then
              echo
              echo 'Failing values must be re-verified against their `source_url` and re-stamped.'
              echo 'See MAINTENANCE.md — Rule 1 (January), Rule 3 (quarterly), Rule 5 (July).'
            fi
            echo
            echo '## Constant-history audit-trail check'
            echo
            echo '```'
            cat history-report.txt 2>/dev/null || echo 'history checker did not produce output — it likely failed to load'
            echo '```'
            if [ '${{ steps.checkhistory.outcome }}' != 'success' ]; then
              echo
              echo 'The history file (data/constant-history.json) has drifted from the live stamps.'
              echo 'Regenerate it with `node scripts/gen-history.mjs` and commit the result.'
            fi
            echo
            echo '## Cross-field invariant negative tests'
            echo
            echo '```'
            cat invariant-report.txt 2>/dev/null || echo 'invariant tests did not produce output — they likely failed to load'
            echo '```'
            if [ '${{ steps.checkinvariants.outcome }}' != 'success' ]; then
              echo
              echo 'An invariant no longer fires on corrupt input, or now fires on valid input.'
              echo 'A green check-constants run does NOT cover this: it proves the current data passes,'
              echo 'not that the gate would catch bad data. Fix invariants() in scripts/check-constants.mjs'
              echo 'rather than relaxing the test.'
            fi
            echo
            echo '## Redirect table check'
            echo
            echo '```'
            cat redirect-report.txt 2>/dev/null || echo 'redirect checker did not produce output — it likely failed to load'
            echo '```'
            if [ '${{ steps.checkredirects.outcome }}' != 'success' ]; then
              echo
              echo '_redirects has a rule that shadows a live page, loops, chains, or touches a'
              echo 'reserved path — or a page in sitemap.xml has no extensionless 301 and would'
              echo 'answer 307 instead. Cloudflare follows redirects even when a real asset matches,'
              echo 'so a bad SOURCE takes a live page off the site while still returning HTTP 200.'
              echo 'Fix the rule in _redirects; do not relax the checker.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
